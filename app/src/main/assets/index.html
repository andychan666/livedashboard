    function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function App() {
      const [currentThemeKey, setCurrentThemeKey] = useState('emerald');
      const [showThemeModal, setShowThemeModal] = useState(false);
      const theme = MINERAL_THEMES[currentThemeKey];

      const [currentTime, setCurrentTime] = useState(new Date());

      const [routeInput, setRouteInput] = useState('277X');
      const [currentRoute, setCurrentRoute] = useState('277X');
      const [direction, setDirection] = useState('outbound');
      const [isCircularRoute, setIsCircularRoute] = useState(false);
      const [routeMeta, setRouteMeta] = useState({ orig: '粉嶺(聯和墟)', dest: '藍田站' });

      const [selectedStop, setSelectedStop] = useState(null);
      const [etaData, setEtaData] = useState([]);
      
      const [isBusLoading, setIsBusLoading] = useState(false);
      const [countdown, setCountdown] = useState(60);
      const [lastBusUpdate, setLastBusUpdate] = useState(new Date());

      const [isLocating, setIsLocating] = useState(false);
      const [currentLocationName, setCurrentLocationName] = useState(DEFAULT_LOCATION.name);
      const [nearbyStops, setNearbyStops] = useState([]);
      const [showNearbyModal, setShowNearbyModal] = useState(false);

      const [weather, setWeather] = useState({
        temperature: 28,
        humidity: 76,
        uvIndex: 5,
        uvLevel: '中等',
        rainfallProb: 20,
        rainfallStatus: '大致多雲，局部短暫陣雨',
        conditionType: 'sun',
        districtRainfall: [],
        warnings: [],
        hourlyForecast: []
      });
      const [isWeatherLoading, setIsWeatherLoading] = useState(false);

      const allKmbStopsRef = useRef(null);

      const isNightTime = useMemo(() => {
        const hours = currentTime.getHours();
        return hours >= 19 || hours < 6;
      }, [currentTime]);

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const fetchWeatherData = useCallback(async () => {
        setIsWeatherLoading(true);
        try {
          const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
          if (res.ok) {
            const data = await res.json();
            const tempObj = data.temperature?.data?.find(d => d.place.includes('北區') || d.place.includes('上水') || d.place.includes('大埔')) 
              || data.temperature?.data?.find(d => d.place === '香港天文台') 
              || data.temperature?.data?.[0];
            
            const temp = tempObj ? tempObj.value : 28;
            const humidity = data.humidity?.data?.[0]?.value || 75;
            const uvData = data.uvindex?.data?.[0];
            const uvVal = uvData ? uvData.value : 5;
            const uvLvl = uvVal > 10 ? '極高' : uvVal > 7 ? '甚高' : uvVal > 5 ? '高' : uvVal > 2 ? '中等' : '低';

            const districtRains = (data.rainfall?.data || []).slice(0, 3).map(r => ({
              name: r.place,
              amount: `${r.max || r.min || 0} mm`
            }));
            const hasRain = data.rainfall?.data?.some(r => (r.max || 0) > 0);

            const iconCode = data.icon?.[0] || 50;
            let cType = 'sun';

            if ([65].includes(iconCode) || (data.warningMessage || []).some(m => m.includes('雷暴'))) {
              cType = 'thunder';
            } else if ([62, 63, 64].includes(iconCode) || hasRain) {
              cType = 'rain';
            } else if ([51, 52].includes(iconCode)) {
              cType = 'cloud-sun';
            } else if ([60, 61].includes(iconCode)) {
              cType = 'cloud';
            } else {
              const hours = new Date().getHours();
              cType = (hours >= 19 || hours < 6) ? 'night' : 'sun';
            }

            const warningList = (data.warningMessage || []).map((msg, i) => ({
              code: `WARN_${i}`,
              name: msg,
              active: true
            }));

            setWeather({
              temperature: temp,
              humidity: humidity,
              uvIndex: uvVal,
              uvLevel: uvLvl,
              rainfallStatus: hasRain ? '部分地區有雨，出門候車請備傘' : '聯和墟大致天晴，降雨率低',
              rainfallProb: hasRain ? 75 : 15,
              conditionType: cType,
              districtRainfall: districtRains,
              warnings: warningList.length > 0 ? warningList : [{ code: 'NORMAL', name: '現無特別天氣警告', active: false }],
              hourlyForecast: [
                { time: '現在', temp: temp, rain: hasRain ? 60 : 15, icon: cType },
                { time: '+2小時', temp: temp, rain: hasRain ? 45 : 20, icon: cType },
                { time: '+4小時', temp: Math.max(20, temp - 1), rain: 20, icon: 'cloud-sun' },
                { time: '+6小時', temp: Math.max(19, temp - 2), rain: 10, icon: 'sun' }
              ]
            });
          }
        } catch (err) {
          console.warn('天氣 API 異常:', err);
        } finally {
          setIsWeatherLoading(false);
        }
      }, []);

      useEffect(() => {
        fetchWeatherData();
        const weatherInterval = setInterval(fetchWeatherData, 15 * 60 * 1000);
        return () => clearInterval(weatherInterval);
      }, [fetchWeatherData]);

      const computeNearbyStops = useCallback((lat, lon) => {
        if (!allKmbStopsRef.current) return [];
        return allKmbStopsRef.current
          .map(s => {
            const sLat = parseFloat(s.lat);
            const sLon = parseFloat(s.long);
            if (isNaN(sLat) || isNaN(sLon)) return null;
            const dist = getDistanceFromLatLonInKm(lat, lon, sLat, sLon);
            return { ...s, distanceMeters: Math.round(dist * 1000) };
          })
          .filter(Boolean)
          .sort((a, b) => a.distanceMeters - b.distanceMeters)
          .slice(0, 8);
      }, []);

      const handleGPSLocate = async () => {
        setIsLocating(true);
        const runLocate = async (lat, lon, locName) => {
          try {
            if (!allKmbStopsRef.current) {
              const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
              if (res.ok) {
                const json = await res.json();
                allKmbStopsRef.current = json.data || [];
              }
            }
            const stops = computeNearbyStops(lat, lon);
            setNearbyStops(stops);
            setCurrentLocationName(locName);
            setShowNearbyModal(true);
          } catch (e) {
            console.error(e);
          } finally {
            setIsLocating(false);
          }
        };

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => runLocate(pos.coords.latitude, pos.coords.longitude, '目前 GPS 位置'),
            () => runLocate(DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon, DEFAULT_LOCATION.name),
            { enableHighAccuracy: true, timeout: 5000 }
          );
        } else {
          runLocate(DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon, DEFAULT_LOCATION.name);
        }
      };

      const fetchRouteDetails = useCallback(async (routeNum, dir) => {
        setIsBusLoading(true);
        const cleanRoute = routeNum.trim().toUpperCase();
        let bound = dir === 'outbound' ? 'outbound' : 'inbound';

        try {
          let infoJson = null;
          let routeInfoRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${cleanRoute}/bound/${bound}/service_type/1`);
          
          if (!routeInfoRes.ok && bound === 'inbound') {
            bound = 'outbound';
            routeInfoRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${cleanRoute}/bound/outbound/service_type/1`);
          }

          if (routeInfoRes.ok) {
            infoJson = await routeInfoRes.json();
          }

          const isCircular = infoJson?.data?.orig_tc === infoJson?.data?.dest_tc || cleanRoute === '278K' || cleanRoute === '70K';
          setIsCircularRoute(isCircular);

          if (infoJson?.data) {
            setRouteMeta({
              orig: infoJson.data.orig_tc,
              dest: isCircular ? `${infoJson.data.dest_tc} (循環線)` : infoJson.data.dest_tc
            });
          }

          const routeStopRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${cleanRoute}/${bound}/1`);
          if (!routeStopRes.ok) throw new Error('找不到該路線');
          const routeStopData = await routeStopRes.json();
          
          if (!routeStopData.data || routeStopData.data.length === 0) {
            throw new Error('此方向暫無班次資料');
          }

          const rawStops = routeStopData.data;
          const resolvedStops = await Promise.all(
            rawStops.map(async (item) => {
              try {
                const stopRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${item.stop}`);
                if (stopRes.ok) {
                  const stopJson = await stopRes.json();
                  return {
                    stopId: item.stop,
                    seq: parseInt(item.seq, 10),
                    name: stopJson.data ? stopJson.data.name_tc : `分站 ${item.seq}`,
                    lat: stopJson.data?.lat,
                    long: stopJson.data?.long
                  };
                }
              } catch (e) {}
              return { stopId: item.stop, seq: parseInt(item.seq, 10), name: `第 ${item.seq} 站` };
            })
          );

          resolvedStops.sort((a, b) => a.seq - b.seq);
          setStopsList(resolvedStops);
          
          if (resolvedStops.length > 0) {
            const luenWoStop = resolvedStops.find(s => s.name.includes('聯和墟'));
            setSelectedStop(luenWoStop || resolvedStops[0]);
          }
        } catch (err) {
          setStopsList([]);
          setSelectedStop(null);
          setEtaData([]);
        } finally {
          setIsBusLoading(false);
        }
      }, []);

      const fetchBusETA = useCallback(async () => {
        if (!selectedStop || !currentRoute) return;
        setIsBusLoading(true);

        try {
          const cleanRoute = currentRoute.trim().toUpperCase();
          const etaRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${selectedStop.stopId}/${cleanRoute}/1`);
          
          if (etaRes.ok) {
            const json = await etaRes.json();
            const dirCode = direction === 'outbound' ? 'O' : 'I';
            const now = new Date();
            const nowTime = now.getTime();

            let validList = (json.data || []).filter(item => {
              if (!item.eta) return false;
              if (isCircularRoute) return true;
              return item.dir === dirCode || !item.dir;
            });

            let parsedList = validList
              .map(item => {
                const etaTime = new Date(item.eta);
                const diffMs = etaTime.getTime() - nowTime;
                const diffMin = Math.max(0, Math.round(diffMs / 60000));
                return {
                  timestamp: etaTime.getTime(),
                  timeStr: etaTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                  diffMinutes: diffMin,
                  remark: item.rmk_tc || (item.co === 'KMB' ? '實時 GPS' : '預定班次'),
                  dest: item.dest_tc || ''
                };
              })
              .filter(item => item.timestamp >= nowTime - 45000);

            parsedList.sort((a, b) => a.timestamp - b.timestamp);

            const uniqueEtas = [];
            const seenTimes = new Set();
            for (const item of parsedList) {
              if (!seenTimes.has(item.timeStr)) {
                seenTimes.add(item.timeStr);
                uniqueEtas.push({
                  ...item,
                  etaSeq: uniqueEtas.length + 1
                });
              }
              if (uniqueEtas.length >= 3) break;
            }

            if (uniqueEtas.length > 0) {
              setEtaData(uniqueEtas);
              setLastBusUpdate(new Date());
              setIsBusLoading(false);
              return;
            }
          }
          setEtaData([]);
          setLastBusUpdate(new Date());
        } catch (err) {
          console.warn(err);
        } finally {
          setIsBusLoading(false);
        }
      }, [selectedStop, currentRoute, direction, isCircularRoute]);

      useEffect(() => {
        fetchRouteDetails(currentRoute, direction);
      }, [currentRoute, direction, fetchRouteDetails]);

      useEffect(() => {
        if (selectedStop) {
          fetchBusETA();
          setCountdown(60);
        }
      }, [selectedStop, fetchBusETA]);

      useEffect(() => {
        const countdownTimer = setInterval(() => {
          setCountdown((prev) => {
            if (prev <= 1) {
              fetchBusETA();
              return 60;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(countdownTimer);

          <div className={`fixed bottom-0 right-1/4 w-96 h-96 rounded-full blur-3xl pointer-events-none transition-colors duration-700 ${theme.glow2}`} />

          <header className={`h-20 flex-shrink-0 px-5 rounded-2xl flex items-center justify-between border backdrop-blur-md transition-all shadow-md z-10 ${theme.cardBg}`}>

                    <span>聯和墟周邊站點</span>

                </div>

                <div className="flex items-center gap-1.5 overflow-x-auto scrollbar-none py-0.5">
                  <span className="text-xs text-stone-400 whitespace-nowrap font-medium flex items-center gap-1">
                    <MapPin className="w-3 h-3 text-amber-400" />

                  {LUEN_WO_HUI_ROUTES.map(({ route, label }) => (

                      className={`text-xs px-2.5 py-1 rounded-lg font-mono font-bold border transition-all whitespace-nowrap ${

                      }`}
                    >
                      {label}
                    </button>
                  ))}
                </div>
              </div>

              <div className={`p-2.5 rounded-xl border flex items-center justify-between ${theme.innerCard}`}>
                <div className="flex items-center gap-2.5">
                  <span className="px-2.5 py-1 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-400 font-mono font-black text-base">
                    {currentRoute}
                  </span>
                  <div className="text-sm font-bold flex items-center gap-2">
                    <span className="text-stone-300">{routeMeta.orig || '粉嶺(聯和墟)'}</span>
                    {isCircularRoute ? (
                      <RotateCw className={`w-3.5 h-3.5 ${theme.accentText} animate-spin-slow`} />

                    className={`px-3 py-1.5 rounded-lg border text-xs font-bold flex items-center gap-1.5 active:scale-95 ${
                      theme.isDark ? 'bg-[#1D252C] border-[#313F4B] text-stone-200' : 'bg-[#E7DED0] border-[#D0C3B0] text-stone-800'

                  >

                  </span>

            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`w-full max-w-md rounded-2xl p-5 border shadow-2xl ${
                theme.isDark ? 'bg-[#181F24] border-[#2F3E4C] text-white' : 'bg-[#FCFAF7] border-[#DFD6C7] text-stone-900'
              }`}>
                <div className="flex items-center justify-between pb-3 border-b border-stone-700/20">
                  <div className="flex items-center gap-2 text-base font-bold text-emerald-400">
                    <Navigation className="w-5 h-5" />
                    <span>{currentLocationName} 周邊巴士站</span>
                  </div>
                  <button
                    onClick={() => setShowNearbyModal(false)}
                    className="text-xs px-3 py-1.5 rounded-lg bg-stone-700/30 hover:bg-stone-700/50"
                  >
                    關閉
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-2 mt-3 max-h-64 overflow-y-auto">
                  {nearbyStops.map((st, i) => (
                    <button
                      key={i}
                      onClick={() => {
                        const match = stopsList.find(s => s.stopId === st.stop);
                        if (match) setSelectedStop(match);
                        else setSelectedStop({ stopId: st.stop, seq: 1, name: st.name_tc });
                        setShowNearbyModal(false);
                      }}
                      className={`p-3 rounded-xl border text-left text-xs transition-all active:scale-95 ${
                        theme.isDark ? 'bg-[#111618] hover:bg-[#1C242A] border-[#26333E]' : 'bg-[#F2ECE1] hover:bg-[#E7DECf] border-[#DDD5C7]'
                      }`}
                    >
                      <div className="font-bold truncate text-sm">{st.name_tc}</div>
                      <div className="text-xs text-amber-400 font-mono mt-1">{st.distanceMeters} 米距離</div>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* 3. 頁腳 */}
          <footer className="h-5 flex-shrink-0 flex items-center justify-between text-[11px] text-stone-500 px-2 border-t border-stone-800/40 z-10">
            <div className="flex items-center gap-1.5">
              <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span>
              <span>香港天文台 (HKO) & 九龍巴士 (KMB DATA.GOV.HK API) 實時連線</span>
            </div>
            <div>粉嶺聯和墟總站 · 常用專線快捷版 · Samsung Galaxy Tab S9</div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
